[project]
name = "rhos-lightspeed-tests"
version = "0.1.0"
description = "Test suite for RHOS Lightspeed in RHOSO environments"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "Apache-2.0"}

dependencies = [
    "pytest>=8.0.0",
    "requests>=2.31.0",
    "pyyaml>=6.0.0",
    "kubernetes>=29.0.0",
    "agent-client-protocol>=1.0.0",
]

[project.scripts]
lightspeed-tests = "rhos_lightspeed_tests:main"
lightspeed-test = "rhos_lightspeed_tests:main"

[dependency-groups]
dev = [
    "ruff>=0.16.1",
    "mypy>=2.3.0",
    "pytest-cov>=6.0.0",
    "pre-commit>=4.6.1",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
extend-select = ["S"]

[tool.ruff.lint.per-file-ignores]
"src/rhos_lightspeed_tests/tests/**/*.py" = ["S101"]
"src/rhos_lightspeed_tests/lightspeed_tests/**/*.py" = ["S101"]
