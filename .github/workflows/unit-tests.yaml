name: Unit tests

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Run unit tests
        run: >-
          uv run --frozen pytest src/rhos_lightspeed_tests/tests/lib
          --cov=rhos_lightspeed_tests.lib
          --cov-report=term-missing
          --cov-fail-under=54
