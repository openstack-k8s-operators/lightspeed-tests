[pytest]
# Used only when no test path, module or node ID is supplied on the command line.
testpaths = rhos_lightspeed_tests.tests
addopts = --verbose --junitxml=test-results.xml -m "not telemetry"
python_files = test_*.py
python_functions = test_*
markers =
    telemetry: requires telemetry-operator metrics collection and a configured Prometheus URL
    llm_dependent: requires generated answer content from a real LLM
