[pytest]
# Used only when no test path, module or node ID is supplied on the command line.
testpaths = rhos_lightspeed_tests.lightspeed_tests.e2e rhos_lightspeed_tests.lightspeed_tests.integration
addopts = --verbose --junitxml=test-results.xml
python_files = test_*.py
python_functions = test_*
markers =
    llm_dependent: requires generated answer content from a real LLM
    openshift_dependent: requires access to an OpenShift cluster
